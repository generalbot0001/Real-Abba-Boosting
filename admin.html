<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Admin Panel - ABDUL VIRAL BOOSTER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#1683ff;
  --blue-dark:#0864d8;
  --bg:#020914;
  --card:#0d1b2d;
  --card2:#11243a;
  --text:#fff;
  --muted:#91a4ba;
  --border:rgba(255,255,255,.08);
  --green:#19c37d;
  --red:#ff5263;
  --yellow:#ffc107;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#020914;
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  max-width:650px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:30px;
}


/* =========================================
   LOGIN
========================================= */

.auth{
  min-height:100vh;
  padding:30px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo-icon{
  width:75px;
  height:75px;
  border-radius:22px;
  background:linear-gradient(135deg,var(--blue),#0054c7);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:30px;
  font-weight:900;
  box-shadow:0 12px 35px rgba(22,131,255,.3);
}

.logo h1{
  font-size:22px;
  margin-top:15px;
}

.logo p{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  color:#b7c6d7;
  font-size:13px;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea{
  width:100%;
  border:1px solid var(--border);
  background:#081523;
  color:#fff;
  padding:14px;
  border-radius:12px;
  outline:none;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:var(--blue);
}

.primary-btn{
  width:100%;
  border:0;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  color:#fff;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(22,131,255,.22);
}

.primary-btn:disabled,
.action-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.message{
  margin-bottom:15px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  display:none;
  line-height:1.5;
}

.message.show{
  display:block;
}

.message.success{
  background:rgba(25,195,125,.12);
  color:#5ce0a8;
}

.message.error{
  background:rgba(255,82,99,.12);
  color:#ff7d89;
}


/* =========================================
   ADMIN APP
========================================= */

.admin-app{
  min-height:100vh;
}

.topbar{
  padding:22px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--blue),#0054c7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.brand-text strong{
  display:block;
  font-size:14px;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.logout-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:#fff;
  width:42px;
  height:42px;
  border-radius:12px;
}


/* =========================================
   CONTENT
========================================= */

.content{
  padding:20px 17px;
}

.page-title{
  font-size:25px;
  font-weight:800;
  margin-bottom:5px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}


/* =========================================
   STATS
========================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:22px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 11px;
}

.stat-icon{
  font-size:20px;
  margin-bottom:9px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
}

.stat-value{
  font-size:18px;
  font-weight:900;
  margin-top:5px;
}


/* =========================================
   SECTION
========================================= */

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.section-title{
  font-size:18px;
  font-weight:800;
}

.refresh-btn{
  border:1px solid var(--border);
  background:var(--card2);
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
  font-size:11px;
  font-weight:bold;
}


/* =========================================
   REQUEST CARD
========================================= */

.request-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:19px;
  padding:17px;
  margin-bottom:13px;
}

.request-card.pending-card{
  border-color:rgba(255,193,7,.2);
}

.request-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:14px;
}

.request-amount{
  font-size:23px;
  font-weight:900;
}

.request-date{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:9px;
  font-weight:800;
}

.status.pending{
  background:rgba(255,193,7,.12);
  color:#ffd45a;
}

.status.approved{
  background:rgba(25,195,125,.12);
  color:#5ce0a8;
}

.status.rejected{
  background:rgba(255,82,99,.12);
  color:#ff7d89;
}

.details{
  background:#081523;
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  margin-bottom:14px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:11px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-row span{
  color:var(--muted);
  flex-shrink:0;
}

.detail-row strong{
  text-align:right;
  word-break:break-word;
}


/* =========================================
   ADMIN NOTE
========================================= */

.note-group{
  margin-bottom:12px;
}

.note-group label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.note-input{
  width:100%;
  min-height:65px;
  background:#081523;
  color:#fff;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px;
  outline:none;
  resize:vertical;
  font-size:12px;
}

.note-input:focus{
  border-color:var(--blue);
}


/* =========================================
   ACTIONS
========================================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-btn{
  border:0;
  padding:13px;
  border-radius:11px;
  color:#fff;
  font-weight:800;
  font-size:12px;
}

.approve-btn{
  background:var(--green);
}

.reject-btn{
  background:var(--red);
}

.action-btn:disabled{
  opacity:.55;
}


/* =========================================
   EMPTY
========================================= */

.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:19px;
  padding:35px 20px;
  text-align:center;
}

.empty-icon{
  font-size:42px;
  margin-bottom:12px;
}

.empty strong{
  display:block;
  font-size:15px;
}

.empty p{
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
  line-height:1.5;
}


/* =========================================
   LOADING
========================================= */

.loading{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  font-size:12px;
}


/* =========================================
   TOAST
========================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#15283d;
  border:1px solid var(--border);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:500;
  width:max-content;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:420px){

  .stats{
    grid-template-columns:1fr;
  }

  .stat-card{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .stat-icon{
    margin:0;
  }

  .stat-value{
    font-size:17px;
  }

}


/* =========================================
   DESKTOP
========================================= */

@media(min-width:700px){

  body{
    padding:20px 0;
  }

  .app{
    min-height:calc(100vh - 40px);
    border-radius:28px;
    box-shadow:0 0 60px rgba(0,0,0,.45);
    overflow:hidden;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vehfhjfhciszkgshohls.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_twl8rzLjHfsqKikAMKw8FQ_JmyvI7C4";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================
   ADMIN DETAILS
========================================= */

const ADMIN_EMAIL =
  "abdulmajeedyunusaaliyu@gmail.com";


let currentUser = null;


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  message,
  type="error"
){

  const box =
    document.getElementById(
      "authMessage"
    );

  box.textContent =
    message;

  box.className =
    "message show " + type;

}


/* =========================================
   FRIENDLY AUTH ERROR
========================================= */

function friendlyAuthError(error){

  const message =
    String(
      error?.message || ""
    );

  const lower =
    message.toLowerCase();


  if(
    lower.includes(
      "invalid login credentials"
    )
  ){

    return "Incorrect admin email or password.";

  }


  if(
    lower.includes(
      "email not confirmed"
    )
  ){

    return "The admin email has not been confirmed yet.";

  }


  if(
    lower.includes(
      "email not confirmed"
    )
  ){

    return "Please confirm the admin email first.";

  }


  return message ||
    "Login failed. Please try again.";

}


/* =========================================
   LOGIN
========================================= */

document
.getElementById("loginForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    if(!email || !password){

      showMessage(
        "Enter the admin email and password."
      );

      return;

    }


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;

    button.textContent =
      "Signing in...";


    showMessage(
      "Signing in to admin panel...",
      "success"
    );


    try{

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });


      if(error)
        throw error;


      if(!data || !data.user){

        throw new Error(
          "Could not sign in."
        );

      }


      const signedInEmail =
        String(
          data.user.email || ""
        ).toLowerCase();


      if(
        signedInEmail !==
        ADMIN_EMAIL.toLowerCase()
      ){

        await supabaseClient
          .auth
          .signOut();

        throw new Error(
          "This account is not authorized to access the admin panel."
        );

      }


      if(
        !data.user.email_confirmed_at
      ){

        await supabaseClient
          .auth
          .signOut();

        throw new Error(
          "Please confirm the admin email before logging in."
        );

      }


      /*
        Verify admin status through
        the secure database function.
      */

      const {
        data:isAdmin,
        error:adminError
      } =
        await supabaseClient
          .rpc("is_admin");


      if(adminError){

        console.error(
          "Admin verification error:",
          adminError
        );

        throw new Error(
          "Could not verify admin access."
        );

      }


      if(isAdmin !== true){

        await supabaseClient
          .auth
          .signOut();

        throw new Error(
          "You are not authorized as an admin."
        );

      }


      currentUser =
        data.user;


      enterAdmin();


    }catch(error){

      console.error(
        "Admin login error:",
        error
      );

      showMessage(
        friendlyAuthError(error)
      );

    }finally{

      button.disabled =
        false;

      button.textContent =
        "Admin Login";

    }

  }
);


/* =========================================
   ENTER ADMIN
========================================= */

function enterAdmin(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");


  document
    .getElementById("adminApp")
    .classList.remove("hidden");


  loadRequests();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if(error){

      console.error(
        "Session error:",
        error
      );

      return;

    }


    const session =
      data?.session;


    if(
      !session ||
      !session.user
    ){

      return;

    }


    const email =
      String(
        session.user.email || ""
      ).toLowerCase();


    if(
      email !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await supabaseClient
        .auth
        .signOut();

      return;

    }


    /*
      Check secure admin function.
    */

    const {
      data:isAdmin,
      error:adminError
    } =
      await supabaseClient
        .rpc("is_admin");


    if(
      adminError ||
      isAdmin !== true
    ){

      await supabaseClient
        .auth
        .signOut();

      return;

    }


    currentUser =
      session.user;


    enterAdmin();


  }catch(error){

    console.error(
      "Session check error:",
      error
    );

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();

  currentUser =
    null;


  document
    .getElementById("adminApp")
    .classList.add("hidden");


  document
    .getElementById("authScreen")
    .classList.remove("hidden");


  document
    .getElementById("loginPassword")
    .value = "";


  showMessage(
    "You have been logged out.",
    "success"
  );

}


/* =========================================
   LOAD REQUESTS
========================================= */

async function loadRequests(){

  if(!currentUser){

    return;

  }


  const box =
    document.getElementById(
      "requestsList"
    );


  const refresh =
    document.getElementById(
      "refreshButton"
    );


  refresh.disabled =
    true;

  refresh.textContent =
    "Loading...";


  box.innerHTML = `
    <div class="loading">
      Loading funding requests...
    </div>
  `;


  try{

    /*
      Get all funding requests.

      Admin SELECT policy allows the
      admin email to read all rows.
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("funding_requests")
        .select(`
          id,
          user_id,
          customer_bank_name,
          customer_account_name,
          amount,
          transaction_reference,
          screenshot_url,
          status,
          admin_note,
          created_at,
          reviewed_at
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error)
      throw error;


    const requests =
      data || [];


    updateStats(
      requests
    );


    if(
      requests.length === 0
    ){

      box.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            📭
          </div>

          <strong>
            No funding requests
          </strong>

          <p>
            Customer funding requests will appear here.
          </p>

        </div>
      `;

      return;

    }


    box.innerHTML =
      requests
        .map(
          request =>
            renderRequest(
              request
            )
        )
        .join("");


  }catch(error){

    console.error(
      "Load requests error:",
      error
    );


    box.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <strong>
          Could not load requests
        </strong>

        <p>
          ${escapeHTML(
            error?.message ||
            "Unknown error"
          )}
        </p>

      </div>
    `;


  }finally{

    refresh.disabled =
      false;

    refresh.textContent =
      "↻ Refresh";

  }

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(
  requests
){

  const pending =
    requests.filter(
      request =>
        String(
          request.status || ""
        ).toLowerCase()
        === "pending"
    );


  const pendingAmount =
    pending.reduce(
      (total,request) =>
        total +
        Number(
          request.amount || 0
        ),
      0
    );


  document
    .getElementById(
      "pendingCount"
    )
    .textContent =
      pending.length.toLocaleString();


  document
    .getElementById(
      "pendingAmount"
    )
    .textContent =
      formatMoney(
        pendingAmount
      );


  document
    .getElementById(
      "totalCount"
    )
    .textContent =
      requests.length.toLocaleString();

}


/* =========================================
   RENDER REQUEST
========================================= */

function renderRequest(
  request
){

  const status =

/* =========================================
   APPROVE
========================================= */

async function approveRequest(
  requestId
){

  if(!currentUser){

    toast(
      "Admin session expired. Please log in again."
    );

    return;

  }


  const noteElement =
    document.getElementById(
      "note-" + requestId
    );


  const note =
    noteElement
      ? noteElement.value.trim()
      : "";


  const confirmed =
    window.confirm(
      "Approve this funding request and credit the customer's wallet?"
    );


  if(!confirmed){

    return;

  }


  const buttons =
    document.querySelectorAll(
      `[onclick*="${requestId}"]`
    );


  buttons.forEach(
    button=>{
      button.disabled =
        true;
    }
  );


  toast(
    "Approving funding request..."
  );


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "approve_funding_request",
          {
            p_request_id:
              requestId,

            p_admin_note:
              note
          }
        );


    if(error)
      throw error;


    console.log(
      "Approval result:",
      data
    );


    toast(
      "Funding approved and wallet credited successfully."
    );


    await loadRequests();


  }catch(error){

    console.error(
      "Approve error:",
      error
    );


    toast(
      error?.message ||
      "Could not approve funding request."
    );


    buttons.forEach(
      button=>{
        button.disabled =
          false;
      }
    );

  }

}

/* =========================================
   MONEY
========================================= */

function formatMoney(
  amount
){

  return "₦" +
    Number(
      amount || 0
    ).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJS(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  );

}


/* =========================================
   TOAST
========================================= */

let toastTimer;


function toast(
  message
){

  const box =
    document.getElementById(
      "toast"
    );


  box.textContent =
    message;


  box.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      ()=>{
        box.classList.remove(
          "show"
        );
      },
      4000
    );

}
