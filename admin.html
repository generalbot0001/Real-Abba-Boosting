<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>ABDUL VIRAL BOOSTER - Admin</title>

<meta
name="description"
content="ABDUL VIRAL BOOSTER Admin Dashboard"
>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--blue:#1683ff;
--blue-dark:#0864d8;
--bg:#07111f;
--card:#0d1b2d;
--card2:#11243a;
--text:#fff;
--muted:#91a4ba;
--border:rgba(255,255,255,.08);
--green:#19c37d;
--red:#ff5263;
--yellow:#ffd45a;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#020914;
color:var(--text);
min-height:100vh;
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

.app{
width:100%;
max-width:480px;
min-height:100vh;
margin:auto;
background:var(--bg);
position:relative;
overflow:hidden;
}

/* =========================
   LOGIN
========================= */

.auth{
min-height:100vh;
padding:35px 22px;
display:flex;
flex-direction:column;
justify-content:center;
}

.logo{
text-align:center;
margin-bottom:35px;
}

.logo-icon{
width:76px;
height:76px;
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
background:linear-gradient(
135deg,
var(--blue),
#0054c7
);
box-shadow:
0 12px 35px rgba(22,131,255,.3);
font-size:30px;
font-weight:900;
}

.logo h1{
font-size:24px;
margin-top:15px;
}

.logo p{
color:var(--muted);
font-size:13px;
margin-top:7px;
}

.auth-card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:20px;
box-shadow:
0 20px 60px rgba(0,0,0,.25);
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
color:#b7c6d7;
font-size:13px;
margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
border:1px solid var(--border);
background:#081523;
color:#fff;
padding:14px;
border-radius:12px;
outline:none;
}

.form-group textarea{
min-height:90px;
resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
border-color:var(--blue);
}

.primary-btn{
width:100%;
border:0;
padding:15px;
border-radius:13px;
background:
linear-gradient(
135deg,
var(--blue),
var(--blue-dark)
);
color:#fff;
font-weight:bold;
box-shadow:
0 8px 25px rgba(22,131,255,.22);
}

.primary-btn:disabled{
opacity:.55;
cursor:not-allowed;
}

.message{
margin-bottom:15px;
padding:12px;
border-radius:10px;
font-size:13px;
display:none;
line-height:1.5;
}

.message.show{
display:block;
}

.message.success{
background:rgba(25,195,125,.12);
color:#5ce0a8;
}

.message.error{
background:rgba(255,82,99,.12);
color:#ff7d89;
}

/* =========================
   ADMIN APP
========================= */

.main-app{
min-height:100vh;
padding-bottom:25px;
}

.topbar{
padding:22px 18px 15px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.brand-icon{
width:42px;
height:42px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
background:
linear-gradient(
135deg,
var(--blue),
#0054c7
);
}

.brand-text strong{
display:block;
font-size:14px;
}

.brand-text span{
display:block;
color:var(--muted);
font-size:10px;
margin-top:2px;
}

.logout-btn{
border:1px solid var(--border);
background:var(--card);
color:#fff;
width:40px;
height:40px;
border-radius:12px;
}

.page{
padding:5px 17px 25px;
}

.page-title{
font-size:25px;
font-weight:800;
margin:10px 0 5px;
}

.page-subtitle{
color:var(--muted);
font-size:13px;
margin-bottom:20px;
}

/* =========================
   ADMIN HEADER
========================= */

.admin-card{
background:
linear-gradient(
135deg,
#0d70df,
#084b9c
);
border-radius:22px;
padding:20px;
margin-bottom:18px;
position:relative;
overflow:hidden;
}

.admin-card:after{
content:"";
position:absolute;
width:130px;
height:130px;
border-radius:50%;
border:25px solid rgba(255,255,255,.06);
right:-40px;
top:-40px;
}

.admin-label{
color:#d8eaff;
font-size:12px;
}

.admin-title{
font-size:24px;
font-weight:900;
margin-top:7px;
}

.admin-email{
font-size:11px;
color:#d8eaff;
margin-top:6px;
}

/* =========================
   STATS
========================= */

.stats-grid{
display:grid;
grid-template-columns:
repeat(2,1fr);
gap:10px;
margin-bottom:20px;
}

.stat-card{
background:var(--card);
border:1px solid var(--border);
border-radius:16px;
padding:16px;
}

.stat-icon{
font-size:22px;
margin-bottom:9px;
}

.stat-card strong{
display:block;
font-size:21px;
}

.stat-card span{
display:block;
color:var(--muted);
font-size:11px;
margin-top:4px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
display:flex;
gap:9px;
margin-bottom:15px;
}

.refresh-btn{
flex:1;
border:1px solid var(--border);
background:var(--card2);
color:#fff;
padding:13px;
border-radius:12px;
font-weight:bold;
}

.filter-select{
flex:1;
border:1px solid var(--border);
background:#081523;
color:#fff;
padding:13px;
border-radius:12px;
outline:none;
}

/* =========================
   ORDER CARD
========================= */

.order-card{
background:var(--card);
border:1px solid var(--border);
border-radius:19px;
padding:17px;
margin-bottom:12px;
}

.order-top{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:13px;
}

.order-name{
font-size:15px;
font-weight:800;
}

.status{
font-size:10px;
padding:6px 9px;
border-radius:20px;
background:
rgba(255,212,90,.12);
color:var(--yellow);
white-space:nowrap;
}

.status.processing{
background:rgba(22,131,255,.12);
color:#58acff;
}

.status.completed{
background:rgba(25,195,125,.12);
color:#5ce0a8;
}

.status.failed{
background:rgba(255,82,99,.12);
color:#ff7d89;
}

.order-details{
color:var(--muted);
font-size:11px;
line-height:1.9;
word-break:break-word;
}

.order-details strong{
color:#fff;
}

.order-id{
color:#58acff!important;
font-size:10px;
}

.order-link{
color:#58acff;
word-break:break-all;
}

.order-actions{
border-top:1px solid var(--border);
margin-top:14px;
padding-top:14px;
}

.action-label{
font-size:12px;
color:#b7c6d7;
margin-bottom:8px;
font-weight:bold;
}

.action-row{
display:flex;
gap:8px;
}

.status-select{
flex:1;
background:#081523;
border:1px solid var(--border);
color:#fff;
padding:11px;
border-radius:11px;
outline:none;
}

.update-btn{
background:var(--blue);
color:#fff;
border:0;
padding:11px 14px;
border-radius:11px;
font-weight:bold;
}

.update-btn:disabled{
opacity:.5;
}

.note-input{
width:100%;
margin-top:9px;
background:#081523;
border:1px solid var(--border);
color:#fff;
padding:11px;
border-radius:11px;
outline:none;
}

.note-input:focus{
border-color:var(--blue);
}

.loading{
text-align:center;
color:var(--muted);
padding:30px;
font-size:13px;
}

.empty{
background:var(--card);
border:1px solid var(--border);
border-radius:17px;
padding:30px;
text-align:center;
color:var(--muted);
font-size:12px;
}

.empty-icon{
font-size:38px;
margin-bottom:10px;
}

/* =========================
   TOAST
========================= */

.toast{
position:fixed;
left:50%;
bottom:25px;
transform:
translateX(-50%)
translateY(20px);
background:#15283d;
border:1px solid var(--border);
color:#fff;
padding:12px 17px;
border-radius:12px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:200;
width:max-content;
max-width:90%;
text-align:center;
}

.toast.show{
opacity:1;
transform:
translateX(-50%)
translateY(0);
}

@media(min-width:600px){

body{
padding:20px 0;
}

.app{
border-radius:28px;
min-height:calc(100vh - 40px);
box-shadow:
0 0 60px rgba(0,0,0,.45);
}

}

</style>

</head>

<body>

<div class="app">

<!-- =========================
     ADMIN LOGIN
========================= -->

id="authScreen"

>

<div class="logo">

AV

></div>

>

>

>
Admin Login

</form>

<!-- =========================
     ADMIN APP
========================= -->

<section
id="mainApp"
class="main-app hidden"
>

<header class="topbar">

<div class="brand">

<div class="brand-icon">
AV
</div>

<div class="brand-text">

<strong>
ABDUL VIRAL BOOSTER
</strong>

</span>

</div>

</div>

class="logout-btn"
onclick="logout()"
>
↪

<main class="page">

Admin Dashboard
</h2>

Manage customer orders and update their status.
</p>


<!-- ADMIN INFO -->

<div class="admin-card">

<div class="admin-label">
Administrator
</div>

<div
class="admin-title"
>
ABDUL VIRAL BOOSTER
</div>

id="adminEmail"
class="admin-email"
>

</div>


<!-- STATS -->

<div class="stats-grid">

<div class="stat-card">

<div class="stat-icon">
📦
</div>

<strong id="totalOrders">
0
</strong>

</strong>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://vehfhjfhciszkgshohls.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_twl8rzLjHfsqKikAMKw8FQ_JmyvI7C4";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


/* =========================================================
   ADMIN
========================================================= */

const ADMIN_EMAIL =
"abdulmajeedyunusaaliyu@gmail.com";


let currentUser = null;
let orders = [];


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
text,
type="error"
){

const box =
document.getElementById(
"authMessage"
);

box.textContent = text;

box.className =
"message show " + type;

}


function clearMessage(){

const box =
document.getElementById(
"authMessage"
);

box.className =
"message";

box.textContent = "";

}


/* =========================================================
   LOGIN
========================================================= */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

clearMessage();

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

if(!email || !password){

showMessage(
"Enter your email and password."
);

return;

}


/*
Only the configured administrator
email is allowed to use this page.
*/

if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

showMessage(
"Access denied. This account is not an administrator."
);

return;

}


const button =
document.getElementById("loginBtn");

button.disabled = true;
button.textContent = "Signing in...";


try{

const {data,error} =
await supabaseClient
.auth
.signInWithPassword({

email:email,
password:password

});


if(error){

showMessage(
error.message
);

button.disabled = false;
button.textContent =
"Admin Login";

return;

}


if(
!data ||
!data.user
){

showMessage(
"Unable to log in."
);

button.disabled = false;
button.textContent =
"Admin Login";

return;

}


currentUser =
data.user;


/*
Double-check the logged-in email.
*/

if(
(currentUser.email || "")
.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

await supabaseClient
.auth
.signOut();

currentUser = null;

showMessage(
"Access denied."
);

button.disabled = false;
button.textContent =
"Admin Login";

return;

}


await enterAdmin();


}catch(error){

console.error(error);

showMessage(
error.message ||
"Unable to log in."
);

}

button.disabled = false;
button.textContent =
"Admin Login";

});


/* =========================================================
   ENTER ADMIN
========================================================= */

async function enterAdmin(){

if(!currentUser) return;


document
.getElementById("authScreen")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");


document
.getElementById("adminEmail")
.textContent =
currentUser.email || ADMIN_EMAIL;


await loadOrders();

}


/* =========================================================
   SESSION CHECK
========================================================= */

async function checkSession(){

try{

const {data,error} =
await supabaseClient
.auth
.getSession();


if(error){

console.error(error);
return;

}


if(
data.session &&
data.session.user
){

const email =
(
data.session.user.email ||
""
).toLowerCase();


if(
email ===
ADMIN_EMAIL.toLowerCase()
){

currentUser =
data.session.user;

await enterAdmin();

}else{

await supabaseClient
.auth
.signOut();

}

}

}catch(error){

console.error(error);

}

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient
.auth
.onAuthStateChange(
function(event,session){

if(
event === "SIGNED_OUT"
){

currentUser = null;

document
.getElementById("mainApp")
.classList.add("hidden");

document
.getElementById("authScreen")
.classList.remove("hidden");

}

});


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

try{

await supabaseClient
.auth
.signOut();

}catch(error){

console.error(error);

}

currentUser = null;

document
.getElementById("mainApp")
.classList.add("hidden");

document
.getElementById("authScreen")
.classList.remove("hidden");

document
.getElementById("loginPassword")
.value = "";

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

if(!currentUser){

toast(
"Please log in as administrator."
);

return;

}


const box =
document.getElementById(
"ordersList"
);

box.innerHTML =
`
<div class="loading">
Loading orders...
</div>
`;


try{

const {data,error} =
await supabaseClient
.from("orders")
.select(`
id,
user_id,
platform,
service,
quantity,
link,
amount,
unit_price,
total_amount,
status,
admin_note,
created_at,
updated_at
`)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(
"Orders error:",
error
);

box.innerHTML =
`
<div class="empty">

<div class="empty-icon">
⚠️
</div>

Unable to load orders.

<p style="margin-top:8px">
${escapeHTML(error.message)}
</p>

</div>
`;

return;

}


orders = data || [];

updateStats();

renderOrders();


}catch(error){

console.error(error);

box.innerHTML =
`
<div class="empty">

<div class="empty-icon">
⚠️
</div>

Unable to load orders.

</div>
`;

}

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

const total =
orders.length;

const pending =
orders.filter(
order =>
order.status === "pending"
).length;

const processing =
orders.filter(
order =>
order.status === "processing"
).length;

const completed =
orders.filter(
order =>
order.status === "completed"
).length;


document
.getElementById("totalOrders")
.textContent =
total;


document
.getElementById("pendingOrders")
.textContent =
pending;


document
.getElementById("processingOrders")
.textContent =
processing;


document
.getElementById("completedOrders")
.textContent =
completed;

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(){

const box =
document.getElementById(
"ordersList"
);

const filter =
document.getElementById(
"statusFilter"
).value;


let filtered =
orders;


if(filter !== "all"){

filtered =
orders.filter(
order =>
order.status === filter
);

}


if(filtered.length === 0){

box.innerHTML =
`
<div class="empty">

<div class="empty-icon">
📦
</div>

<strong>
No orders found
</strong>

<p style="margin-top:7px">
There are no orders in this category.
</p>

</div>
`;

return;

}


box.innerHTML =
filtered
.map(
order =>
createOrderHTML(order)
)
.join("");

}


/* =========================================================
   ORDER HTML
========================================================= */

function createOrderHTML(order){

const status =
String(
order.status || "pending"
)
.toLowerCase();


let statusClass = "";

if(status === "processing"){
statusClass =
"processing";
}

if(status === "completed"){
statusClass =
"completed";
}

if(status === "failed"){
statusClass =
"failed";
}


const statusText =
status
.charAt(0)
.toUpperCase() +
status.slice(1);


const created =
order.created_at
?
new Date(
order.created_at
).toLocaleString(
"en-NG"
)
:
"—";


const updated =
order.updated_at
?
new Date(
order.updated_at
).toLocaleString(
"en-NG"
)
:
"—";


const amount =
Number(
order.total_amount ??
order.amount ??
0
);


const unitPrice =
Number(
order.unit_price || 0
);


return `

<div
class="order-card"
id="order-${escapeHTML(order.id)}"
>

<div class="order-top">

<div class="order-name">

${escapeHTML(
order.platform
)} ${escapeHTML(
order.service
)}

</div>

<div
class="status ${statusClass}"
>

${escapeHTML(
statusText
)}

</div>

</div>


<div class="order-details">

Order ID:

<strong class="order-id">
${escapeHTML(order.id)}
</strong>

<br>

Customer ID:

<strong>
${escapeHTML(order.user_id)}
</strong>

<br>

Platform:

<strong>
${escapeHTML(order.platform)}
</strong>

<br>

Service:

<strong>
${escapeHTML(order.service)}
</strong>

<br>

Quantity:

<strong>
${Number(
order.quantity || 0
).toLocaleString()}
</strong>

<br>

Price:

<strong>
${formatMoney(unitPrice)}
 / 1,000
</strong>

<br>

Amount:

<strong style="color:#58acff">
${formatMoney(amount)}
</strong>

<br>

Created:

${escapeHTML(created)}

<br>

Updated:

${escapeHTML(updated)}

<br>

Link:

<a
class="order-link"
href="${escapeHTML(order.link)}"
target="_blank"
rel="noopener noreferrer"
>
${escapeHTML(order.link)}
</a>

${
order.admin_note
?
`
<br>
Admin Note:

<strong>
${escapeHTML(
order.admin_note
)}
</strong>
`
:
""
}

</div>


<div class="order-actions">

<div class="action-label">
Update Order
</div>


<div class="action-row">

<select
class="status-select"

/* =========================================================
   UPDATE ORDER
========================================================= */

async function updateOrder(orderId){

if(!currentUser){

toast(
"Please log in first."
);

return;

}


const statusSelect =
document.getElementById(
"status-" + orderId
);

const noteInput =
document.getElementById(
"note-" + orderId
);

const button =
document.getElementById(
"update-" + orderId
);


if(!statusSelect){

toast(
"Order control not found."
);

return;

}


const status =
statusSelect.value;

const note =
noteInput
?
noteInput.value.trim()
:
"";


button.disabled = true;
button.textContent =
"Saving...";


try{

const {data,error} =
await supabaseClient
.rpc(
"update_order_status",
{
p_order_id:orderId,
p_status:status,
p_admin_note:note
}
);


if(error){

console.error(
"Update order error:",
error
);

toast(
error.message ||
"Unable to update order."
);

button.disabled = false;
button.textContent =
"Update";

return;

}


if(!data){

toast(
"Order was not updated."
);

button.disabled = false;
button.textContent =
"Update";

return;

}


toast(
"Order updated successfully."
);


/*
Reload from Supabase so the admin
panel always shows the database value.
*/

await loadOrders();


}catch(error){

console.error(error);

toast(
error.message ||
"Unable to update order."
);

}


button.disabled = false;
button.textContent =
"Update";

}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(amount){

return "₦" +
Number(
amount || 0
)
.toLocaleString(
"en-NG",
{
minimumFractionDigits:0,
maximumFractionDigits:2
}
);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(value){

return String(
value ?? ""
)
.replace(
/\\/g,
"\\\\"
)
.replace(
/'/g,
"\\'"
)
.replace(
/"/g,
'\\"'
)
.replace(
/\n/g,
"\\n"
)
.replace(
/\r/g,
"\\r"
);

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

const box =
document.getElementById(
"toast"
);

box.textContent =
message;

box.classList.add("show");

clearTimeout(
toastTimer
);

toastTimer =
setTimeout(
function(){

box.classList.remove(
"show"
);

},
3500
);

}


/* =========================================================
   START
========================================================= */

checkSession();

</script>
